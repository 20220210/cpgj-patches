name: Decode v1.0.6 raw zip

on:
  push:
    paths:
      - '.github/workflows/decode-v106-raw-zip.yml'
      - 'patches/v1.0.6/cpjl-project-hotfix-v1.0.6-remove-header-reset-button-source-20260612.rawzip.base64.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode raw zip and update manifest
        run: |
          set -euo pipefail
          SRC='patches/v1.0.6/cpjl-project-hotfix-v1.0.6-remove-header-reset-button-source-20260612.rawzip.base64.txt'
          ZIP='patches/v1.0.6/cpjl-project-hotfix-v1.0.6-remove-header-reset-button-source-20260612.zip'
          MANIFEST='manifest/latest.json'
          base64 -d "$SRC" > "$ZIP"
          python3 - <<'PY'
          import hashlib, json, pathlib
          zip_path = pathlib.Path('patches/v1.0.6/cpjl-project-hotfix-v1.0.6-remove-header-reset-button-source-20260612.zip')
          manifest_path = pathlib.Path('manifest/latest.json')
          data = zip_path.read_bytes()
          manifest = {
              'schema': 'cpgj-github-patch-feed/v1',
              'updatedAt': '2026-06-12T08:58:00Z',
              'latest': {
                  'name': zip_path.name,
                  'version': 'v1.0.6',
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size': len(data),
                  'url': 'https://raw.githubusercontent.com/20220210/cpgj-patches/main/' + str(zip_path).replace('\\', '/'),
                  'note': 'Remove top-right reset button. Raw zip, no base64 encoding.'
              }
          }
          manifest_path.parent.mkdir(parents=True, exist_ok=True)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('zip_size=', len(data))
          print('zip_sha256=', hashlib.sha256(data).hexdigest())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ZIP" "$MANIFEST"
          git commit -m 'publish v1.0.6 raw zip manifest' || exit 0
          git push
